<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="css/login.css" />
        <title>Логинация</title>
    </head>
    <body>
        <div class="login">
            <div class="login__entry">
                <h1 class="login__title">Войти</h1>
                <img src="images/login.png" alt="login image" class="login__image">
            </div>
        
            <form id="login__form">
                <div id="login__error__bar">🤓 Поля обязательные</div>
                <label class="login__label">Электропочта</label>
                <input type="email" name="email" id="login__input__email">
                <p class="login__hint">Введите электропочту в формате *****@***.**</p>
            
                <label class="login__label">Пароль</label>
                <input type="password" name="password" id="login__input__pass">
                <button type="submit" class="login__submit">Продолжить</button>
            </form>
        </div> 
        <script src="js/checkpassword.js"></script>       
    </body>
</html>
