<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="StylesLogin.css">
    </head>
    <body>
        <h1>Войти</h1>
        <img src="storage/login.jpg" width="462" height="501" class="loginimg"/>
        <div id="entrance">
            <div id="containers">
                <div id="fmail">
                    <p class="label">Электропочта</p>
                    <input type="text" class="container"/>
                    <p class="description">Введите электропочту в формате *****@***.**</p>
                </div>
                <div id="fpass">
                    <p class="label">Пароль</p>
                    <input type="password" class="container"/>
                </div>    
            </div>    
            <button type="button" class="button">Продолжить</button>
        </div>    
    </body>
</html>
