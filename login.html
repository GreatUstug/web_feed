<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/login.css">
    <title>Логинация</title>
</head>

<body>
    <div class="container__login">
        <div class="left">
            <div class="login">
                <div class="login__text">Войти</div>
                <img src="images/login.png" alt="login_image" class="login__img">
            </div>
        </div>
        <div class="right">
            <form>
                <div class="login__entrance">
                    <label for="email" class="entrance__label">Электропочта</label>
                    <input type="email" class="entrance__input">
                    <p class="entrance__description">Введите электропочту в формате *****@***.**</p>
                </div>
                <div class="login__entrance">
                    <label for="password" class="entrance__label">Пароль</label>
                    <input type="password" class="entrance__input">
                </div>
                <button type="button" class="entrance__button">Продолжить</button>
            </form>    
        </div>
    </div>
</body>

</html>
