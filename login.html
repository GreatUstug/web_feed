<!DOCTYPE html>
<html lang="ru">
    <head> 
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/login.css">
        <title>Логинация</title>
    </head>
    <body>
        <h1 class="login__text">Войти</h1>
        <img src="images/login.png" alt="login_image" class="login__img">
        <div class="login__entrance">
            <p class="container__label">Электропочта</p>
            <input type="text" class="container__input">
            <p class="container__description">Введите электропочту в формате *****@***.**</p>
            <p class="container__label">Пароль</p>
            <input type="password" class="container__input"> 
            <button type="button" class="entrance__button">Продолжить</button>
        </div>        
    </body>
</html>
