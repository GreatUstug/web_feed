<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/creating.css">
    <title>Создание_нового_поста</title>
</head>

<body>
    <div class="creating__container">
        <div class="container__headline">
            <div class="headline__back"><img src="images/Button.png" alt="button"></div>
            <div class="headline__new">Новый пост</div>
            <div class="headline__back"></div>
        </div>
        <div class="container__editor">
            <div class="editor__push">
                <div class="push__image">
                    <div class="image">
                        <img src="images/Text.png" alt="Text" class="image__text">
                        <input type="file" id="file-input" accept="image/*" multiple style="display: none;" onchange="previewImages()">
                        <button type="button" class="image__add" onclick="triggerFileInput()">Добавить фото</button>
                    </div>
                </div>
            </div>
            <div class="container__add">
                <div class="add__icon"><img src="images/Plus-square 16.png" alt="Plus-square"></div>
                <div class="add__text">Добавить фото</div>
            </div>
            <div class="container__text">
                <div class="text__add__text">Добавьте подпись...</div>
            </div>
            <div class="container__button">
                <div class="container__push__button">
                    <button type="submit" class="push__button">Поделиться</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/validate.js"></script>
</body>

</html>
